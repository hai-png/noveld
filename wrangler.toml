# Cloudflare Pages configuration
#
# Valid Pages properties in wrangler.toml:
# - name (project name)
# - compatibility_date
# - pages_build_output_dir (the static output directory)
# - [vars] (runtime env vars)
#
# NOT supported: [build] section (build command + cwd are set in dashboard)

name = "noveld-pay-dashboard"
compatibility_date = "2026-08-29"
pages_build_output_dir = "out"

[vars]
NEXT_PUBLIC_API_URL = "https://verifier-api-selfhosted.onrender.com"
